<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Directory | Bucks County Business &amp; Jobs</title>
  <meta name="description" content="Search, filter, and sort local companies near Tinicum Township, Bucks County.">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Main navigation">
      <a class="brand" href="index.html"><span class="brand-mark">BC</span><span>Bucks County Business &amp; Jobs</span></a>
      <div class="nav-links">
        <a href="index.html">Map</a>
        <a href="directory.html" aria-current="page">Directory</a>
        <a href="hiring-audit.html">Hiring Audit</a>
        <a href="data-quality.html">Data Quality</a>
        <a href="about.html">About</a>
        <a class="button" href="https://github.com/techmore/bucks-county-business-jobs/issues/new?title=Add%20or%20update%20a%20business&body=Business%20name%3A%0ATown%3A%0AWhat%20to%20add%20or%20fix%3A%0AAre%20they%20hiring%3F%20How%20do%20you%20know%3F">Add or Fix a Business</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <p class="eyebrow">Employer Directory</p>
      <h1>Find companies by fit, size, category, and hiring status.</h1>
      <p class="lead"><span data-result-count>0</span> companies shown inside the 25-mile Tinicum radius.</p>
      <p class="meta" data-result-shown></p>
    </section>

    <section class="section">
      <form class="toolbar" role="search">
        <label>
          <span class="eyebrow">Search</span>
          <input data-filter="search" type="search" placeholder="Company, category, keyword, or town">
        </label>
        <label>
          <span class="eyebrow">Category</span>
          <select data-filter="category"></select>
        </label>
        <label>
          <span class="eyebrow">Town</span>
          <select data-filter="town"></select>
        </label>
        <label>
          <span class="eyebrow">Hiring Signal</span>
          <select data-filter="signal">
            <option value="">All signals</option>
            <option value="positive">Positive signals</option>
            <option value="audited">Audited</option>
            <option value="hiring_likely">Hiring likely</option>
            <option value="hiring_possible">Hiring possible</option>
            <option value="careers_page_found">Careers page found</option>
            <option value="not_hiring_signal">Not hiring signal</option>
            <option value="unknown">Unknown</option>
            <option value="not_audited">Not audited</option>
          </select>
        </label>
        <label>
          <span class="eyebrow">Website</span>
          <select data-filter="website">
            <option value="">All website states</option>
            <option value="with">Has website</option>
            <option value="without">Needs website</option>
          </select>
        </label>
        <label>
          <span class="eyebrow">Sort</span>
          <select data-sort>
            <option value="alpha">Alphabetical A-Z</option>
            <option value="employees">Most employees</option>
            <option value="oldest">Years in existence: oldest</option>
            <option value="newest">Years in existence: newest</option>
            <option value="score">Best Places score</option>
          </select>
        </label>
        <div class="checks">
          <label class="check"><input data-filter="hiring" type="checkbox"> Hiring now</label>
          <label class="check"><input data-filter="onboarding" type="checkbox"> Known for strong onboarding</label>
        </div>
      </form>
      <div class="card-grid" data-directory-results></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>Bucks County Business &amp; Jobs Directory © 2026</span>
      <a href="https://github.com/techmore/bucks-county-business-jobs">GitHub</a>
    </div>
  </footer>
  <script src="assets/app.js"></script>
</body>
</html>
