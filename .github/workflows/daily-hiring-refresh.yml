name: Daily hiring refresh

# Re-checks the businesses with the oldest hiring info each day, applies the
# transparency rules (tools/hiring-rules.js), and publishes the result.
on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC = early morning in Bucks County
  workflow_dispatch:
    inputs:
      limit:
        description: "How many business websites to check"
        default: "400"

permissions:
  contents: write

concurrency:
  group: hiring-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check business websites (oldest info first)
        run: node tools/audit-hiring.js --stale-first --limit "${{ github.event.inputs.limit || '400' }}" --concurrency 8 --update --output reports/daily-hiring-audit.json
      - name: Apply transparency rules
        run: node tools/clean-data.js --write
      - name: Publish if anything changed
        run: |
          if git diff --quiet companies.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "hiring-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add companies.json
          git commit -m "Daily hiring refresh $(date -u +%Y-%m-%d)"
          git push
