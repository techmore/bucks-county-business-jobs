name: Daily hiring refresh

# Re-checks the businesses with the oldest hiring info each day, applies the
# transparency rules (tools/hiring-rules.js), and publishes the result.
on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC = early morning in Bucks County
  workflow_dispatch:
    inputs:
      limit:
        description: "How many business websites to check"
        default: "400"

permissions:
  contents: write

concurrency:
  group: hiring-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check business websites (oldest info first)
        run: node tools/audit-hiring.js --stale-first --limit "${{ github.event.inputs.limit || '400' }}" --concurrency 8 --update --output reports/daily-hiring-audit.json
      - name: Monthly - refresh PA registration years (data.pa.gov, public domain)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.event.schedule, '17 9')
        run: |
          if [ "$(date -u +%d)" = "02" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node tools/fetch-pa-registry.js
            node tools/match-pa-registry.js --write
            node tools/enrich-osm-tags.js --write || echo "OpenStreetMap busy; will retry next month"
          else
            echo "Not the monthly run."
          fi
      - name: Find "open since" years on websites not checked yet
        run: |
          node tools/find-website-years.js --limit 150 --concurrency 6
          node tools/find-website-years.js --apply
      - name: Apply transparency rules
        run: node tools/clean-data.js --write
      - name: Rebuild database and business pages
        run: |
          node --no-warnings tools/build-db.js
          node --no-warnings tools/build-pages.js
      - name: Publish if anything changed
        run: |
          git add -A companies.json data/hiring-history.jsonl data/website-years.json company sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "hiring-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily hiring refresh $(date -u +%Y-%m-%d)"
          git push
